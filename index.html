<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コヨーテゲーム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%; /* Ensure html and body take full viewport height */
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent body scroll by default on mobile */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F0F4F8; /* Light Gray Background - consistent with infographic */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 0.25rem 0.25rem 0 0.25rem; /* Adjusted padding: top, right, bottom (0), left */
            box-sizing: border-box;
        }
        .game-container, .log-container { /* Unified card styling */
            background-color: #FFFFFF; /* White card background - consistent with infographic */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); /* shadow-md - consistent with infographic */
            padding: 0.25rem; /* Adjusted padding for compact view */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem; /* Adjusted gap for compact view */
            height: 100%; /* Fill parent height in horizontal layout */
        }
        .palette-red { color: #FF6B6B; }
        .palette-yellow { color: #FFD166; }
        .palette-green { color: #06D6A0; }
        .palette-blue { color: #118AB2; }
        .palette-dark-blue { color: #073B4C; }

        .bg-palette-red { background-color: #FF6B6B; }
        .bg-palette-yellow { background-color: #FFD166; }
        .bg-palette-green { background-color: #06D6A0; }
        .bg-palette-blue { background-color: #118AB2; }
        .bg-palette-dark-blue { background-color: #073B4C; }

        .btn {
            padding: 0.4rem 0.8rem; /* Increased button padding */
            font-size: 0.8rem; /* Increased button font size */
            border-radius: 0.25rem; /* Reduced border-radius */
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 2px -1px rgba(0, 0, 0, 0.05), 0 0.5px 1px -0.5px rgba(0, 0, 0, 0.03); /* Further reduced shadow */
        }
        .btn-primary {
            background-color: #118AB2; /* Strong Blue - consistent with infographic */
            color: white;
        }
        .btn-primary:hover {
            background-color: #0d6e8b;
            transform: translateY(-0.5px); /* Further reduced transform */
            box-shadow: 0 1.5px 2px -0.5px rgba(0, 0, 0, 0.075), 0 0.75px 1.25px -0.25px rgba(0, 0, 0, 0.04); /* Further reduced shadow */
        }
        .btn-danger {
            background-color: #FF6B6B; /* Vibrant Red - consistent with infographic */
            color: white;
        }
        .btn-danger:hover {
            background-color: #e65a5a;
            transform: translateY(-0.5px); /* Further reduced transform */
            box-shadow: 0 1.5px 2px -0.5px rgba(0, 0, 0, 0.075), 0 0.75px 1.25px -0.25px rgba(0, 0, 0, 0.04); /* Further reduced shadow */
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .player-card {
            width: 60px; /* Fixed width for mobile and desktop */
            height: 80px; /* Fixed height for mobile and desktop */
            background-color: #073B4C; /* Dark Blue for back - consistent with infographic */
            border-radius: 0.25rem; /* Adjusted border-radius */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem; /* Adjusted font size */
            font-weight: bold;
            color: white;
            border: 1.5px solid #118AB2; /* Adjusted border */
            box-shadow: 0 1.5px 3px -0.5px rgba(0, 0, 0, 0.06), 0 0.75px 1.5px -0.25px rgba(0, 0, 0, 0.03); /* Adjusted shadow */
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .player-card.revealed {
            background-color: #FFD166; /* Yellow for revealed - consistent with infographic */
            color: #073B4C;
            border-color: #FF6B6B; /* Red border for revealed */
        }
        .player-card .card-value { /* Target the span specifically */
            white-space: nowrap; /* Prevent numbers from wrapping vertically */
        }
        .player-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.05rem; /* Further reduced gap for mobile player area */
            padding: 0.05rem; /* Further reduced padding for mobile player area */
            border-radius: 0.15rem; /* Adjusted border-radius */
            transition: background-color 0.3s ease;
        }
        .player-area.active {
            background-color: #E0F7FA; /* Light blue tint for active player */
            border: 0.5px solid #118AB2; /* Further reduced border */
        }
        .player-area h3 { /* Player name font size adjustment */
            font-size: 0.5rem; /* Adjusted font size for player names */
            font-weight: 600;
            color: #073B4C;
            margin-bottom: 0; /* Remove default margin */
            line-height: 1; /* Compact line height */
        }
        .player-area p { /* Life text font size */
            font-size: 0.5rem; /* Adjusted font size for life text */
            line-height: 1; /* Compact line height */
        }
        .message-box {
            background-color: #FFFBEB; /* Light yellow - consistent with infographic */
            border: 0.25px solid #FFD166; /* Further reduced border */
            color: #78350F; /* Dark brown */
            padding: 0.15rem 0.3rem; /* Further reduced padding */
            border-radius: 0.15rem; /* Adjusted border-radius */
            margin-top: 0.1rem; /* Further reduced margin */
            margin-bottom: 0.1rem;
            width: 100%;
            text-align: center;
            font-weight: 500;
            font-size: 0.5rem; /* Further reduced font size */
        }
        .hidden-card-back {
            background-color: #073B4C; /* Dark Blue */
            border: 1.5px solid #118AB2; /* Adjusted border */
        }
        .card-deck-item {
            /* width will be set dynamically in JS */
            height: 45px; /* Increased card deck item height */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.1rem; /* Further reduced border-radius */
            font-size: 0.8rem; /* Increased font size */
            font-weight: bold;
            border: 0.1px solid; /* Further reduced border */
            transition: all 0.3s ease;
            white-space: nowrap; /* Prevent numbers from wrapping vertically */
        }
        .card-deck-item.used {
            background-color: #E2E8F0; /* Gray-200 */
            color: #A0AEC0; /* Gray-400 */
            border-color: #CBD5E0; /* Gray-300 */
            opacity: 0.7;
        }
        /* Log specific styling for highlighting */
        .log-player-name {
            color: #118AB2; /* palette-blue */
            font-weight: 600; /* font-semibold */
        }
        .log-number {
            color: #FF6B6B; /* palette-red */
            font-weight: 700; /* font-bold */
        }

        /* --- Universal Layout (Applies to all screen sizes) --- */
        #mainLayout {
            display: flex;
            flex-direction: column; /* Column layout for all screens */
            gap: 0.25rem; /* Adjusted gap for main layout */
            width: 100%;
            height: 100vh; /* Take full viewport height */
            max-width: 390px; /* Constrain max width to iPhone 14 width universally */
            margin: 0 auto; /* Center on all screens */
            padding: 0.25rem 0.25rem 0 0.25rem; /* Adjusted padding: top, right, bottom (0), left */
            box-sizing: border-box;
        }

        #gameContainer {
            width: 100%;
            height: 100%; /* Fill mainLayout height */
            flex-grow: 1;
            padding: 0.25rem; /* Adjusted padding */
            gap: 0.25rem; /* Adjusted gap */
            overflow: hidden; /* No scrollbar on game container itself */
            display: flex; /* Make gameContainer a flex column */
            flex-direction: column;
        }
        #gameContainer h1 {
            font-size: 0.8rem; /* Further reduced h1 font size */
            color: #073B4C; /* Dark Blue - consistent with infographic */
            margin-bottom: 0.1rem; /* Reduce margin */
        }
        #roundDisplay {
            font-size: 0.6rem; /* Further reduced round display font size */
            color: #118AB2; /* Strong Blue - consistent with infographic */
            margin-bottom: 0.1rem; /* Reduce margin */
        }
        #gameContainer h2 {
            font-size: 0.6rem; /* Further reduced h2 font size */
            color: #073B4C; /* Dark Blue - consistent with infographic */
            margin-bottom: 0.1rem; /* Reduce margin */
        }

        /* Fixed width for the control row */
        .control-row-width {
            /* Sum of fixed widths (90 + 60 + 60 + 90) + 3 gaps of 0.1rem (3 * 1.6px = 4.8px) */
            width: calc(90px + 60px + 60px + 90px + 3 * 0.1rem);
            max-width: 100%; /* Ensure it doesn't overflow if screen is too small */
        }

        #bidInput {
            width: 90px; /* Fixed width */
            height: 1.5rem; /* Consistent height for all elements in this row */
            padding: 0.05rem; /* Adjust padding to fit new height */
            font-size: 0.6rem; /* Adjust font size */
            box-sizing: border-box; /* Include padding in element's total width and height */
            text-align: center;
            border: 0.5px solid #CBD5E0;
            border-radius: 0.25rem;
        }
        #bidInput:focus {
            outline: none;
            border-color: #118AB2;
            box-shadow: 0 0 0 1.5px rgba(17, 138, 178, 0.2);
        }

        #prevBidBtn, #nextBidBtn {
            width: 60px; /* Fixed width */
            padding: 0.05rem; /* Adjust padding for smaller buttons */
            font-size: 0.5rem; /* Adjust font size */
            height: 1.5rem; /* Consistent height */
            box-sizing: border-box;
        }

        #raiseBidBtn {
            width: 90px; /* Fixed width */
            padding: 0.05rem; /* Adjust padding */
            font-size: 0.6rem; /* Adjust font size */
            height: 1.5rem; /* Consistent height */
            box-sizing: border-box;
        }

        #gameControls {
            flex-direction: column; /* Column layout for rows */
            gap: 0.1rem; /* Reduced gap between rows */
            width: 100%;
            margin-top: 0.1rem; /* Reduced margin-top */
            flex-shrink: 0; /* Prevent shrinking */
        }
        #gameControls > div { /* Apply to direct children (the two rows) */
            width: 100%; /* Take full width of parent */
            display: flex;
            justify-content: center; /* Center the fixed-width items */
            align-items: stretch; /* Make all items in this row the same height */
            gap: 0.1rem; /* Reduced gap within rows */
        }
        #coyoteBtn {
            width: 100%; /* Full width of its parent .control-row-width */
            height: 1.5rem; /* Consistent height with the row above */
            padding: 0.05rem;
            font-size: 0.6rem;
            box-sizing: border-box;
        }
        /* Removed #nextRoundBtn, #showCardCompositionBtn from here */


        #playersArea {
            grid-template-columns: repeat(3, 1fr); /* Evenly spaced columns */
            gap: 0.1rem; /* Adjusted gap for player grid */
            justify-content: center; /* Center the grid items within the playersArea */
            flex-shrink: 0; /* Prevent shrinking */
            /* No flex-grow or overflow-y:auto here to prevent scrollbar */
        }
        /* Adjusted margin for card composition section */
        .card-composition-section {
            margin-top: 0.1rem; /* Further reduced margin-top */
            flex-shrink: 0;
            width: 100%; /* Ensure it spans full width */
            text-align: center; /* Center the h2 */
        }
        .card-composition-section h2 {
            font-size: 0.6rem; /* Reduced font size */
            text-align: center; /* Ensure text is centered */
        }
        #availableCardsArea {
            /* Changed to column to stack rows */
            display: flex;
            flex-direction: column;
            gap: 0.05rem; /* Reduced gap between rows */
            justify-content: center; /* Center rows */
            width: 100%; /* Ensure it takes full width */
        }

        #logDisplay {
            height: auto; /* Removed fixed height */
            max-height: none; /* Removed fixed max-height */
            flex-grow: 1; /* Allow it to take remaining space */
            width: 100%; /* Full width within gameContainer */
            padding: 0.25rem;
            flex-shrink: 0; /* Prevent shrinking */
            background-color: #FFFFFF; /* White card background */
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            display: flex; /* Make it a flex container */
            flex-direction: column; /* Stack title and content vertically */
        }
        #logDisplay h2 {
            font-size: 0.6rem;
            margin-bottom: 0.1rem;
            flex-shrink: 0; /* Prevent title from shrinking */
        }
        .log-content-scrollable { /* New container for scrollable log content */
            overflow-y: auto; /* Make this part scrollable */
            width: 100%; /* Ensure it takes full width */
            height: 6.7rem; /* Fixed height for 5 lines of log content (0.7rem font-size * 1.2 line-height + 0.5rem padding) * 5 lines */
        }
        #logContent {
            font-size: 0.7rem; /* Adjusted font size for log content */
            line-height: 1.2; /* Adjusted line height for log content */
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Ensure it's on top of other content */
            backdrop-filter: blur(2px); /* Optional: blur background */
        }

        .modal-content {
            background-color: #FFFFFF;
            border-radius: 0.75rem;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            padding: 1rem;
            max-width: 350px; /* Adjusted for iPhone 14 width */
            max-height: 90vh; /* Max height to fit screen, allow scroll if content is too long */
            overflow-y: auto; /* Enable scrolling for content if it exceeds max-height */
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative; /* For positioning close button */
        }

        .modal-close-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #073B4C;
            font-weight: bold;
        }

        /* New styles for bottom buttons */
        #bottomButtons {
            display: flex;
            justify-content: center;
            gap: 0.5rem; /* Increased gap between buttons */
            width: 100%;
            margin-top: 0.25rem; /* Add some space above */
            flex-shrink: 0;
        }
        #bottomButtons .btn {
            flex-grow: 1; /* Allow buttons to grow and fill space */
            width: calc(50% - 0.25rem); /* Calculate width for two buttons with gap */
            height: 2rem; /* Make buttons taller */
            font-size: 0.7rem; /* Adjust font size for larger buttons */
        }
    </style>
</head>
<body>
    <div id="mainLayout" class="flex flex-col gap-4 w-full h-full items-start">
        <div id="gameContainer" class="game-container flex-grow">
            <h1 class="text-3xl font-bold mb-2">コヨーテゲーム</h1>
            <div id="roundDisplay" class="text-xl font-semibold mb-2">
                ラウンド: <span id="currentRoundNumber">0</span>
            </div>

            <div id="messageBox" class="message-box hidden"></div>

            <div id="playersArea" class="grid grid-cols-1 gap-4 w-full justify-items-center">
            </div>

            <div id="gameControls" class="flex flex-col gap-2 mt-4 w-full justify-center items-center">
                <div class="flex flex-row gap-1 justify-center items-center control-row-width">
                    <input type="number" id="bidInput" placeholder="数字を入力" class="p-2 border border-gray-300 rounded-md text-center text-lg focus:outline-none focus:ring-2 focus:ring-palette-blue whitespace-nowrap">
                    <button id="prevBidBtn" class="btn btn-primary">←</button>
                    <button id="nextBidBtn" class="btn btn-primary">→</button>
                    <button id="raiseBidBtn" class="btn btn-primary flex-grow">宣言する</button>
                </div>
                <div class="w-full control-row-width">
                    <button id="coyoteBtn" class="btn btn-danger w-full">コヨーテ！</button>
                </div>
                </div>

            <div class="card-composition-section hidden">
                <h2 class="text-xl font-semibold mb-2">カード構成</h2>
                <div id="availableCardsArea" class="flex flex-wrap justify-center gap-1">
                </div>
            </div>

            <div id="logDisplay" class="log-container w-full">
                <h2 class="text-xl font-bold mb-2">ゲームログ</h2>
                <div class="log-content-scrollable">
                    <div id="logContent" class="text-sm space-y-1">
                    </div>
                </div>
            </div>

            <div id="bottomButtons">
                <button id="nextRoundBtn" class="btn btn-primary hidden">次のラウンドに進む</button>
                <button id="showCardCompositionBtn" class="btn btn-primary">カード構成を表示</button>
            </div>
        </div>
    </div>

    <div id="cardCompositionModal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close-btn" id="closeModalBtn">✖</button>
            <h2 class="text-xl font-bold mb-2 text-center text-palette-dark-blue">カード構成</h2>
            <div id="modalAvailableCardsArea" class="flex flex-wrap justify-center gap-1">
                </div>
        </div>
    </div>

    <script>
        const players = [];
        let currentDealerIndex = 0;
        let currentPlayerIndex = 0;
        let cardsInPlay = []; // This array holds the actual card values dealt to players for sum calculation in the current round
        let dealtCards = []; // This array tracks all card values that have been dealt throughout the game
        let currentBid = { value: 0, bidderIndex: -1 };
        let isGameStarted = false;
        let isRoundActive = false;
        let roundNumber = 0;
        let logEntryCounter = 0; // Counter for sequential log entries
        const initialLives = 3;
        
        // Define the full initial deck based on the new composition
        const initialCardDeck = [
            // -10: 1枚
            -10,
            // -5: 2枚
            -5, -5,
            // 0: 4枚
            0, 0, 0, 0,
            // 0(夜): 1枚
            '0_夜', 
            // 1: 4枚
            1, 1, 1, 1,
            // 2: 4枚
            2, 2, 2, 2,
            // 3: 4枚
            3, 3, 3, 3,
            // 4: 4枚
            4, 4, 4, 4,
            // 5: 4枚
            5, 5, 5, 5,
            // 10: 4枚
            10, 10, 10, 10,
            // 15: 2枚
            15, 15,
            // 20: 1枚
            20,
            // ×2: 1枚
            '×2',
            // MAX→0: 1枚
            'MAX→0',
            // ?: 1枚
            '？'
        ];

        // Define the display order and counts for the "Card Composition" section
        const cardCompositionDisplayOrder = [
            { value: 20, count: 1 },
            { value: 15, count: 2 },
            { value: 10, count: 4 },
            { value: 5, count: 4 },
            { value: 4, count: 4 },
            { value: 3, count: 4 },
            { value: 2, count: 4 },
            { value: 1, count: 4 },
            { value: 0, count: 4 },
            { value: '0_夜', count: 1 }, // 0(夜)を明示的に追加
            { value: -5, count: 2 },
            { value: -10, count: 1 },
            { value: '×2', count: 1 },
            { value: 'MAX→0', count: 1 },
            { value: '？', count: 1 }
        ];

        // DOM Elements
        const messageBox = document.getElementById('messageBox');
        const playersArea = document.getElementById('playersArea');
        const bidInput = document.getElementById('bidInput');
        const raiseBidBtn = document.getElementById('raiseBidBtn');
        const coyoteBtn = document.getElementById('coyoteBtn');
        const prevBidBtn = document.getElementById('prevBidBtn'); // New button reference
        const nextBidBtn = document.getElementById('nextBidBtn'); // New button reference
        // const availableCardsArea = document.getElementById('availableCardsArea'); // この要素はモーダル内に移動
        const currentRoundNumberDisplay = document.getElementById('currentRoundNumber');
        const logContent = document.getElementById('logContent'); // Log content element
        const logDisplay = document.getElementById('logDisplay'); // Reference to the log container itself
        const nextRoundBtn = document.getElementById('nextRoundBtn'); // New button reference

        // Modal related DOM elements
        const showCardCompositionBtn = document.getElementById('showCardCompositionBtn');
        const cardCompositionModal = document.getElementById('cardCompositionModal');
        const modalAvailableCardsArea = document.getElementById('modalAvailableCardsArea'); // モーダル内のカード表示エリア
        const closeModalBtn = document.getElementById('closeModalBtn');


        // Game Initialization
        function initializePlayers(numPlayers = 3) {
            players.length = 0; // Clear existing players
            for (let i = 0; i < numPlayers; i++) {
                players.push({
                    id: `player${i}`,
                    name: `プレイヤー${i + 1}`,
                    lives: initialLives,
                    currentCard: null,
                    isEliminated: false
                });
            }
            renderPlayers();
        }

        // Render Players UI
        function renderPlayers() {
            playersArea.innerHTML = '';
            players.forEach((player, index) => {
                if (player.isEliminated) return; // Don't render eliminated players

                const playerDiv = document.createElement('div');
                playerDiv.id = player.id;
                // Active player highlighting only when round is active
                playerDiv.className = `player-area card ${currentPlayerIndex === index && isRoundActive ? 'active' : ''}`;
                // Adjusted player name and life text sizes
                playerDiv.innerHTML = `
                    <h3 class="font-semibold text-palette-dark-blue">${player.name}</h3>
                    <p class="text-sm text-muted">ライフ: <span class="font-bold text-palette-red">${'❤️'.repeat(player.lives)}</span></p>
                    <div class="player-card">
                        <span class="card-value">${player.currentCard !== null ? player.currentCard : '?'}</span>
                    </div>
                `;
                playersArea.appendChild(playerDiv);

                const cardElement = playerDiv.querySelector('.player-card');
                const cardValueElement = cardElement.querySelector('.card-value');

                // Logic for showing/hiding cards
                // If the round is active AND it's the user's card (player 0), hide it.
                // Otherwise (round is over, or it's an AI player), reveal the card.
                if (isRoundActive && index === 0) {
                    cardValueElement.textContent = '?';
                    cardElement.classList.add('hidden-card-back');
                    cardElement.classList.remove('revealed');
                } else if (player.currentCard !== null) {
                    // For AI players or when round is over, show the card
                    cardValueElement.textContent = player.currentCard; // Display string for special cards
                    cardElement.classList.add('revealed');
                    cardElement.classList.remove('hidden-card-back');
                } else {
                    // Default for non-active, non-revealed (e.g., eliminated player's card area)
                    cardValueElement.textContent = '?';
                    cardElement.classList.add('hidden-card-back');
                    cardElement.classList.remove('revealed');
                }
            });
        }

        // Render Available Cards in the Deck Area (Card Composition) - Now renders into the modal
        function renderAvailableCards() {
            modalAvailableCardsArea.innerHTML = ''; // Clear previous cards in modal

            // Create counts for cards currently in play (visible to other players) for this round
            const currentRoundVisibleCardCounts = {};
            players.forEach((player, index) => {
                if (!player.isEliminated && index !== 0 && player.currentCard !== null) {
                    currentRoundVisibleCardCounts[player.currentCard] = (currentRoundVisibleCardCounts[player.currentCard] || 0) + 1;
                }
            });

            // Create counts for all cards dealt throughout the game
            const dealtCardCountsInGame = {};
            dealtCards.forEach(card => {
                dealtCardCountsInGame[card] = (dealtCardCountsInGame[card] || 0) + 1;
            });

            // Create mutable copies of counts for rendering, so we can "consume" them
            const tempDealtCounts = { ...dealtCardCountsInGame };
            const tempVisibleCounts = { ...currentRoundVisibleCardCounts };

            cardCompositionDisplayOrder.forEach(cardType => {
                const rowDiv = document.createElement('div');
                // Use flexbox for the row to center items and control spacing
                rowDiv.className = 'flex flex-row justify-center items-center gap-0.05rem w-full';
                modalAvailableCardsArea.appendChild(rowDiv);

                // Calculate width dynamically for each card in this row
                // This ensures cards are evenly spaced and fit the row
                const itemWidth = `calc((100% - ${(cardType.count - 1) * 0.05}rem) / ${cardType.count})`;

                for (let i = 0; i < cardType.count; i++) {
                    const cardValue = cardType.value;
                    const cardElement = document.createElement('div');

                    let isGrayed = false;
                    // Prioritize graying out cards visible in the current round, then any dealt cards
                    if (tempVisibleCounts[cardValue] && tempVisibleCounts[cardValue] > 0) {
                        isGrayed = true;
                        tempVisibleCounts[cardValue]--; // "Consume" one visible card for rendering
                    } else if (tempDealtCounts[cardValue] && tempDealtCounts[cardValue] > 0) {
                        isGrayed = true;
                        tempDealtCounts[cardValue]--; // "Consume" one dealt card for rendering
                    }

                    cardElement.className = `card-deck-item ${isGrayed ? 'used bg-gray-300 text-gray-500 border-gray-400 opacity-70' : 'bg-white text-palette-dark-blue border-palette-blue'}`;
                    cardElement.style.width = itemWidth; // Apply dynamic width
                    cardElement.textContent = cardValue;
                    rowDiv.appendChild(cardElement);
                }
            });
        }

        // Update the main message box
        function updateMessageBox(msg, type = 'info') {
            messageBox.textContent = msg;
            messageBox.classList.remove('hidden', 'bg-red-100', 'border-red-400', 'text-red-700', 'bg-green-100', 'border-green-400', 'text-green-700', 'bg-yellow-100', 'border-yellow-400', 'text-yellow-700');
            if (type === 'error') {
                messageBox.classList.add('bg-red-100', 'border-red-400', 'text-red-700');
            } else if (type === 'success') {
                messageBox.classList.add('bg-green-100', 'border-green-400', 'text-green-700');
            } else { // Default for info messages
                messageBox.classList.add('bg-yellow-100', 'border-yellow-400', 'text-yellow-700');
            }
            messageBox.classList.remove('hidden');
        }

        // Add an entry to the game log
        function addLogEntry(msg, type = 'info') {
            logEntryCounter++; // Increment counter
            const logEntry = document.createElement('p');
            let formattedMsg = `${logEntryCounter}. ${msg}`; // Use sequential number

            // Highlight player names
            formattedMsg = formattedMsg.replace(/(プレイヤー\d+)/g, '<span class="log-player-name">$1</span>');
            // Highlight numbers, being careful not to highlight the sequential log number itself
            formattedMsg = formattedMsg.replace(/(\d+)/g, (match, p1, offset, string) => {
                // Check if the number is at the beginning of the string (the logEntryCounter)
                // This is a simple check, more robust regex might be needed for complex cases
                if (offset === 0 || (offset === String(logEntryCounter).length + 2 && string.startsWith(`${logEntryCounter}. `))) {
                    return match; // Don't highlight the log entry number
                }
                return `<span class="log-number">${p1}</span>`;
            });


            logEntry.innerHTML = formattedMsg; // Use innerHTML to render spans
            logEntry.classList.add('py-0.5', 'px-1', 'rounded-sm');

            if (type === 'error') {
                logEntry.classList.add('text-red-700', 'bg-red-50');
            } else if (type === 'success') {
                logEntry.classList.add('text-green-700', 'bg-green-50');
            } else if (type === 'info') {
                logEntry.classList.add('text-blue-700', 'bg-blue-50');
            } else { // Default for general actions
                logEntry.classList.add('text-gray-700');
            }
            logContent.appendChild(logEntry);
            logContent.scrollTop = logContent.scrollHeight; // Auto-scroll to bottom
        }


        // Game Start
        function startGame() {
            logContent.innerHTML = ''; // Clear log on new game start
            logEntryCounter = 0; // Reset log counter
            dealtCards = []; // Reset dealt cards for a new game (all cards available again)
            initializePlayers();
            isGameStarted = true;
            roundNumber = 0; // Reset round number for a new game
            currentRoundNumberDisplay.textContent = roundNumber; // Update display
            currentDealerIndex = -1; // Will be incremented to 0 in startRound
            updateMessageBox('ゲーム開始！');
            addLogEntry('新しいゲームが開始されました。', 'info');
            // renderAvailableCards(); // Moved to be called when modal is shown
            nextRoundBtn.classList.add('hidden'); // ゲーム開始時は非表示にする
            setTimeout(startRound, 1500);
        }

        // Start New Round
        function startRound() {
            logContent.innerHTML = ''; // Clear log at the start of each round
            logEntryCounter = 0; // Reset log counter for each round
            roundNumber++;
            currentRoundNumberDisplay.textContent = roundNumber; // Update display for new round
            isRoundActive = true; // Set round as active
            cardsInPlay = []; // Clear current round's cards for sum calculation
            currentBid = { value: 0, bidderIndex: -1 };
            bidInput.value = ''; // Clear bid input
            bidInput.disabled = false;
            raiseBidBtn.disabled = false;
            coyoteBtn.disabled = false;
            prevBidBtn.disabled = false; // Enable new buttons
            nextBidBtn.disabled = false; // Enable new buttons
            nextRoundBtn.classList.add('hidden'); // ラウンド開始時は非表示にする

            // Determine next dealer (player who lost last round, or next in line)
            const activePlayers = players.filter(p => !p.isEliminated);
            currentDealerIndex = (currentDealerIndex + 1) % activePlayers.length;
            let actualDealerIndex = players.indexOf(activePlayers[currentDealerIndex]); // Get original index

            currentPlayerIndex = (actualDealerIndex + 1) % players.length;
            while(players[currentPlayerIndex].isEliminated){
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            }

            updateMessageBox(`${players[currentPlayerIndex].name} の番です。`);
            addLogEntry(`ラウンド ${roundNumber} 開始！ディーラーは ${players[actualDealerIndex].name} です。`, 'info');

            dealCards(); // This will update cardsInPlay and add to dealtCards
            renderPlayers(); // Re-render players to apply card hiding logic
            setTimeout(() => {
                addLogEntry(`${players[currentPlayerIndex].name} の番です。`);
                if (currentPlayerIndex !== 0) { // If AI turn
                    setTimeout(aiTurn, 2000);
                }
            }, 1000);
        }

        // Deal Cards
        function dealCards() {
            // Create a temporary deck for this round's dealing, starting from the full initial deck
            let cardsRemainingInDeck = [];
            const tempDealtCounts = {}; // To track how many of each card are already dealt

            // Populate tempDealtCounts from the global dealtCards array
            dealtCards.forEach(card => {
                tempDealtCounts[card] = (tempDealtCounts[card] || 0) + 1;
            });

            // Build cardsRemainingInDeck by iterating through initialCardDeck and removing dealt instances
            initialCardDeck.forEach(card => {
                if (tempDealtCounts[card] && tempDealtCounts[card] > 0) {
                    tempDealtCounts[card]--; // "Consume" one dealt instance
                } else {
                    cardsRemainingInDeck.push(card); // This card instance is available
                }
            });

            // Shuffle the remaining cards
            for (let i = cardsRemainingInDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardsRemainingInDeck[i], cardsRemainingInDeck[j]] = [cardsRemainingInDeck[j], cardsRemainingInDeck[i]];
            }

            cardsInPlay = []; // Clear for new round's sum calculation

            players.forEach(player => {
                if (!player.isEliminated) {
                    if (cardsRemainingInDeck.length > 0) {
                        const dealtCard = cardsRemainingInDeck.pop();
                        player.currentCard = dealtCard;
                        cardsInPlay.push(dealtCard);
                        dealtCards.push(dealtCard); // Add to the game-long dealt cards list
                    } else {
                        console.warn("Not enough cards left to deal to all active players in dealCards.");
                        player.currentCard = null; // Assign null if no cards left
                    }
                } else {
                    player.currentCard = null; // Eliminated players don't get a card
                }
            });
            addLogEntry('カードが配られました。');
            // renderAvailableCards(); // This function is now called when the modal is shown
        }

        // Get total sum of cards
        function getTotalSum() {
            let sum = 0;
            // This function currently only sums numeric cards.
            // Special card effects (e.g., '×2', 'MAX→0', '0_夜', '？') are NOT implemented here.
            // They will require additional logic to modify the sum based on their rules.
            cardsInPlay.forEach(card => {
                if (typeof card === 'number') {
                    sum += card;
                } else {
                    // Handle special cards for sum calculation if their effect is a direct number addition/subtraction
                    // For '0_夜', it's still 0 for sum calculation for now.
                    // For '×2', 'MAX→0', '？', their effects need to be applied to the *final* sum, not individual card values.
                    // This is a placeholder for future logic.
                    if (card === '0_夜') {
                        sum += 0; // Treat '0_夜' as 0 for sum for now.
                    }
                }
            });
            return sum;
        }

        // Handle Bid
        function handleBid() {
            const bidValue = parseInt(bidInput.value);
            if (isNaN(bidValue) || bidValue <= currentBid.value) {
                updateMessageBox(`無効な宣言です。${currentBid.value + 1} 以上の数字を入力してください。`, 'error');
                addLogEntry(`無効な宣言: ${bidInput.value}。${currentBid.value + 1} 以上が必要です。`, 'error');
                return;
            }
            if (bidValue > 99) { // Arbitrary high limit
                updateMessageBox('宣言が大きすぎます。もっと小さい数字にしてください。', 'error');
                addLogEntry(`宣言が大きすぎます: ${bidValue}。`, 'error');
                return;
            }

            currentBid = { value: bidValue, bidderIndex: currentPlayerIndex };
            updateMessageBox(`${players[currentPlayerIndex].name} が ${bidValue} と宣言しました。`);
            addLogEntry(`${players[currentPlayerIndex].name} が ${bidValue} と宣言しました。`);

            moveToNextPlayer();
            renderPlayers();

            if (currentPlayerIndex !== 0) { // If AI turn
                setTimeout(aiTurn, 2000);
            } else {
                updateMessageBox(`${players[currentPlayerIndex].name} の番です。`);
                addLogEntry(`${players[currentPlayerIndex].name} の番です。`);
            }
        }

        // Handle Coyote (Challenge)
        function handleCoyote() {
            if (currentBid.value === 0) {
                updateMessageBox('まだ宣言がありません。', 'error');
                addLogEntry('コヨーテ宣言: まだ宣言がありません。', 'error');
                return;
            }

            isRoundActive = false; // Set round as inactive immediately
            bidInput.disabled = true;
            raiseBidBtn.disabled = true;
            coyoteBtn.disabled = true;
            prevBidBtn.disabled = true; // Disable new buttons
            nextBidBtn.disabled = true; // Disable new buttons

            updateMessageBox(`${players[currentPlayerIndex].name} がコヨーテ！と宣言しました！`, 'info');
            addLogEntry(`${players[currentPlayerIndex].name} がコヨーテ！と宣言しました！`, 'info');

            setTimeout(() => {
                const actualSum = getTotalSum(); // This sum does not yet account for special card effects
                updateMessageBox(`実際の合計は ${actualSum} です。`);
                addLogEntry(`全てのカードが公開されました。合計は ${actualSum} です。`, 'info');

                let loserPlayer = null;
                let winnerPlayer = null;

                if (actualSum < currentBid.value) {
                    // Bidder loses
                    loserPlayer = players[currentBid.bidderIndex];
                    winnerPlayer = players[currentPlayerIndex]; // Challenger wins
                    updateMessageBox(`${loserPlayer.name} は宣言 (${currentBid.value}) を達成できませんでした！`, 'error');
                    addLogEntry(`${loserPlayer.name} は宣言 (${currentBid.value}) を達成できませんでした。`, 'error');
                } else {
                    // Challenger loses
                    loserPlayer = players[currentPlayerIndex];
                    winnerPlayer = players[currentBid.bidderIndex]; // Bidder wins
                    updateMessageBox(`${winnerPlayer.name} の宣言 (${currentBid.value}) が正しかったです！`, 'success');
                    addLogEntry(`${winnerPlayer.name} の宣言 (${currentBid.value}) が正しかったです。`, 'success');
                }

                if (loserPlayer) {
                    loserPlayer.lives--;
                    addLogEntry(`${loserPlayer.name} はライフを1失いました。残りライフ: ${loserPlayer.lives}`, 'error');
                    if (loserPlayer.lives <= 0) {
                        loserPlayer.isEliminated = true;
                        addLogEntry(`${loserPlayer.name} は脱落しました！`, 'error');
                    }
                }
                renderPlayers(); // Re-render players to show updated lives and revealed cards

                setTimeout(() => {
                    checkGameOver();
                    // ゲームオーバーでなければ次のラウンドボタンを表示
                    if (players.filter(p => !p.isEliminated).length > 1) { // プレイヤーが2人以上残っている場合
                        nextRoundBtn.classList.remove('hidden');
                        updateMessageBox('次のラウンドに進むか、新しいゲームを開始してください。');
                    }
                }, 2000);
            }, 1500);
        }

        // Reveal all cards (This function is now redundant for its original purpose, but kept for clarity if needed elsewhere)
        function revealCards() {
            // The card revelation is now primarily handled by renderPlayers when isRoundActive is false
            // This function can be removed or repurposed if its direct DOM manipulation is no longer needed.
            // For now, it's not strictly necessary as renderPlayers will do the job.
        }

        // Move to the next active player
        function moveToNextPlayer() {
            let nextPlayer = currentPlayerIndex;
            let foundNext = false;
            for (let i = 0; i < players.length; i++) {
                nextPlayer = (nextPlayer + 1) % players.length;
                if (!players[nextPlayer].isEliminated) {
                    currentPlayerIndex = nextPlayer;
                    foundNext = true;
                    break;
                }
            }
            if (!foundNext) {
                // This case should ideally not happen if checkGameOver is working
                console.error("No next active player found. Game should be over.");
            }
        }

        // Check if game is over
        function checkGameOver() {
            const activePlayers = players.filter(p => !p.isEliminated);
            if (activePlayers.length <= 1) {
                isGameStarted = false;
                isRoundActive = false;
                updateMessageBox(`${activePlayers[0].name} の勝利です！ゲーム終了！`, 'success');
                addLogEntry(`${activePlayers[0].name} の勝利です！ゲーム終了！`, 'success');
                // ゲームオーバーの場合は「次のラウンドに進む」ボタンを表示しない
                nextRoundBtn.classList.add('hidden');
                // 新しいゲームを開始するボタンなどを表示するロジックをここに追加
                // 例: リセットボタンの表示
                setTimeout(() => {
                    // ここで新しいゲームを開始するボタンなどを表示する
                    // 例えば、startGame() を呼び出すためのボタンを表示するなど
                    updateMessageBox('新しいゲームを開始するにはページをリロードしてください。'); // 仮のメッセージ
                }, 2000);
            }
        }

        // AI Logic
        function aiTurn() {
            if (!isRoundActive) return;

            const aiPlayer = players[currentPlayerIndex];
            // AIのカードも考慮して合計値を計算（特殊カードは数値として扱われるか、無視される）
            // AIの意思決定ロジックは、特殊カードの効果を考慮するように拡張する必要があります。
            const visibleCardsSum = cardsInPlay.filter((_, index) => index !== currentPlayerIndex).reduce((sum, card) => {
                if (typeof card === 'number') {
                    return sum + card;
                }
                // 特殊カードはAIの計算では0として扱う（暫定）
                return sum;
            }, 0);
            
            let aiCardValue = 0;
            if (typeof aiPlayer.currentCard === 'number') {
                aiCardValue = aiPlayer.currentCard;
            } else {
                // AIにとっての特殊カードの価値をどう評価するか、ロジックを追加する必要があります。
                // 現時点では、特殊カードはAIの合計値計算では0として扱われます。
                if (aiPlayer.currentCard === '0_夜') {
                    aiCardValue = 0;
                }
                // '×2', 'MAX→0', '？' はAIの合計値計算には直接影響しないため、0として扱う
            }

            let potentialSum = visibleCardsSum + aiCardValue;

            // Simple AI:
            // 1. If current bid is 0, make a conservative bid (e.g., sum of visible cards + a small random number)
            // 2. If current bid is higher than what AI thinks is possible, challenge (coyote)
            // 3. Otherwise, raise the bid slightly
            if (currentBid.value === 0) {
                // First bid, be conservative but not too low
                const bid = Math.max(1, Math.floor(potentialSum * 0.7) + Math.floor(Math.random() * 3));
                bidInput.value = bid;
                handleBid();
            } else if (currentBid.value >= potentialSum) {
                // If current bid is too high, challenge
                handleCoyote();
            } else {
                // Otherwise, raise the bid
                const minBid = currentBid.value + 1;
                const maxBid = potentialSum + Math.floor(Math.random() * 5); // Allow some bluffing
                const bid = Math.min(Math.max(minBid, Math.floor(Math.random() * (maxBid - minBid + 1)) + minBid), 99); // Ensure bid is within reasonable range and not too high
                bidInput.value = bid;
                handleBid();
            }
        }

        // Bid Input Navigation (Prev/Next buttons)
        function navigateBid(direction) {
            let currentVal = parseInt(bidInput.value);
            if (isNaN(currentVal)) {
                currentVal = currentBid.value; // Start from current bid if input is empty
            }

            if (direction === 'prev') {
                bidInput.value = Math.max(currentBid.value + 1, currentVal - 1);
            } else if (direction === 'next') {
                bidInput.value = currentVal + 1;
            }
        }

        // Modal functions
        function showCardCompositionModal() {
            cardCompositionModal.classList.remove('hidden');
            renderAvailableCards(); // Render cards when modal is shown
        }

        function hideCardCompositionModal() {
            cardCompositionModal.classList.add('hidden');
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            raiseBidBtn.addEventListener('click', handleBid);
            coyoteBtn.addEventListener('click', handleCoyote);
            prevBidBtn.addEventListener('click', () => navigateBid('prev')); // Event for prev button
            nextBidBtn.addEventListener('click', () => navigateBid('next')); // Event for next button
            bidInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleBid();
                }
            });

            // Next Round button event listener
            nextRoundBtn.addEventListener('click', () => {
                if (players.filter(p => !p.isEliminated).length > 1) {
                    startRound();
                } else {
                    // ゲームオーバーの場合は新しいゲームを促す
                    updateMessageBox('ゲームは終了しました。新しいゲームを開始してください。', 'info');
                }
            });

            // Card Composition button event listener
            showCardCompositionBtn.addEventListener('click', showCardCompositionModal);

            // Close modal button and overlay click listener
            closeModalBtn.addEventListener('click', hideCardCompositionModal);
            cardCompositionModal.addEventListener('click', (e) => {
                if (e.target === cardCompositionModal) { // Only close if clicking the overlay, not the content
                    hideCardCompositionModal();
                }
            });

            // 最初にゲームを開始
            startGame();
        });
    </script>
